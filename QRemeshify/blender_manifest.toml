schema_version = "1.0.0"

id = "qremeshify"
version = "1.2.1"
name = "QRemeshify"
tagline = "Quad remesher with symmetry and cleaner edge flow"
maintainer = "TamKungZ_"
type = "add-on"

website = "https://github.com/TamKungZ/ReQRemeshify"
tags = ["Mesh"]

# Blender's Extension system starts at 4.2, so the extension manifest must use
# 4.2+. The same Python add-on code declares Blender 4.0+ in bl_info and can be
# installed as a legacy add-on on Blender 4.0/4.1.
blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

platforms = ["windows-x64", "macos-arm64", "macos-x64", "linux-x64"]

[permissions]
files = "Import and export temporary OBJ files for the remeshing pipeline"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
